[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hospitality_pms"
version = "16.4.0"
description = "Hospitality PMS for Sarawat Park Resort"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.24.0",
    "click>=8.2.1",
    "pyyaml>=6.0",
    "pathspec>=0.12.0",
    "json5>=0.13.0",
    "pydantic>=2.13.0"
]

[tool.setuptools.packages.find]
include = ["hospitality_pms*"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0"
erpnext = ">=16.0.0"
hrms = ">=16.0.0"
